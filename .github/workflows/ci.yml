name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db

      - run: npm run lint

      - run: npm run typecheck

      # Saf fonksiyon doğrulama koşuları (kas kuralları, kas haritası,
      # antrenman geçmişi) — veritabanı gerektirmez
      - run: npm run verify
